<!doctype html>
<html lang="{{idioma}}">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{titulo}}</title>
<meta name="description" content="{{descripcion}}" />
<meta name="generator" content="D.A.R.K. · kit inmersivo" />
<link rel="stylesheet" href="kit/fuentes.css" />
<link rel="stylesheet" href="kit/inmersivo.css" />
<style>
  :root {
    --fondo: {{fondo}};
    --texto: {{texto}};
    --acento: {{acento}};
    --tenue: color-mix(in srgb, {{texto}} 58%, transparent);
  }
</style>
</head>
<body>
<canvas id="lienzo" aria-hidden="true"></canvas>
<div class="recorrido" id="recorrido"></div>
<main>
{{estaciones}}
</main>
<div class="pista" id="pista">Desliza para entrar · pasa el cursor por lo que veas</div>
<button class="sonido" id="sonido" aria-pressed="false"><i><span></span><span></span><span></span></i><em>Sonido apagado</em></button>
<div class="ficha" id="ficha" role="status" aria-live="polite"><b></b><span class="breve"></span><span class="mas"></span></div>
<script id="mundo" type="application/json">{{mundo}}</script>
<figure class="visor" id="visor" hidden><img alt="" /><figcaption></figcaption></figure>
{{fotos_script}}<script src="kit/inmersivo.min.js"></script>
</body>
</html>
